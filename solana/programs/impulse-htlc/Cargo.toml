# Impulse HTLC (I18, Solana half): a minimal example sha256 hash time-locked escrow for SPL Token
# and Token-2022 (no mint extensions). Owner decision D33. See README.md.
[package]
name = "impulse-htlc"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[features]
no-entrypoint = []

[dependencies]
pinocchio = { workspace = true, features = ["cpi", "copy"] }
pinocchio-system = { workspace = true }
pinocchio-token-2022 = { workspace = true }
solana-address = { version = "2.0", features = ["curve25519"] }
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }

[dev-dependencies]
litesvm = "=0.7.0"
sha2 = "0.10.8"
solana-sdk = "2.3.1"
solana-program = "2.3.0"
solana-program-pack = "2.2.1"
spl-token = "6.0.0"
spl-token-2022 = { workspace = true }
