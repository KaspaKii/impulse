# Solana workspace (I19 escrow, I18 Solana half). Its own Cargo.lock and rust-toolchain.toml;
# excluded from the Kaspa workspace at the repo root (owner decision D28). Dependency versions
# follow solana-foundation/dvp at df9919ed02c25a93620e7f6820107c9050ce3b92 (MIT, see LICENSE-MIT).
[workspace]
resolver = "2"
# Every crate under programs/ is a member (programs/.gitkeep keeps the glob valid while empty).
members = ["programs/*"]

[workspace.package]
version = "0.2.0-alpha"
edition = "2021"
repository = "https://github.com/kaspakii/impulse"

[workspace.dependencies]
borsh = "1.5.5"
codama = "^0.7.2"
num-derive = "0.4.1"
num-traits = "0.2.19"
pinocchio = "^0.10.1"
pinocchio-associated-token-account = "^0.3.0"
pinocchio-log = "^0.5.1"
pinocchio-system = "^0.5.0"
pinocchio-token = "0.5.0"
pinocchio-token-2022 = "^0.2.0"
solana-security-txt = "1.1.3"
serde_json = "1.0.145"
spl-token-2022 = { version = "9.0.0", features = ["no-entrypoint"] }
thiserror = "2.0.17"
