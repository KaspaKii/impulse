# cargo audit for the Solana workspace (scripts/ci-solana.sh runs it with --deny warnings).
# Triaged 2026-10-11 in review round 1 of I18/I19. Semver-compatible fixes were taken in the lock
# (bytes, crossbeam-epoch, quinn-proto, rustls 0.23, anyhow, keccak, event-listener, rand 0.8 and
# 0.9). What remains is ignored one by one below. "Host only" means the crate is not compiled
# into any on-chain program: the SBF build (target/sbpf-solana-solana/release/deps after
# cargo-build-sbf of all four programs) links none of them except bincode, and
# `cargo tree -p impulse-solana -e normal --target all -i <crate>` shows no path for the others.
# They come in through litesvm, solana-sdk, solana-client types or the test harness, which run
# only in tests on the developer's machine. A new advisory fails CI.
[advisories]
ignore = [
    "RUSTSEC-2026-0346", # rustls 0.21.12 Debug impls expose session secrets, via tokio-tungstenite in solana-pubsub-client (websocket only). No program or tool uses the pubsub client; the RPC HTTPS path the tools use is rustls 0.23.46, which has the fix. Triaged 2026-10-17
    "RUSTSEC-2026-0349", # rustls 0.21.12 ServerHello downgrade, same websocket-only path and reason. Triaged 2026-10-17
    "RUSTSEC-2024-0344", # curve25519-dalek 3.2.0 timing, via ed25519-dalek 1.0.1 (solana-keypair, agave precompiles in litesvm). Host only; the programs never make an ed25519 signature
    "RUSTSEC-2022-0093", # ed25519-dalek 1.0.1 signing oracle, same path. Host only; tests sign with throwaway keys only
    "RUSTSEC-2026-0104", # rustls-webpki 0.101.7 CRL parsing panic, via rustls 0.21 (solana RPC client types). Host only; tests make no network connection
    "RUSTSEC-2026-0098", # rustls-webpki 0.101.7 URI name constraints, same path and reason
    "RUSTSEC-2026-0099", # rustls-webpki 0.101.7 wildcard name constraints, same path and reason
    "RUSTSEC-2021-0139", # ansi_term unmaintained (litesvm). Host only
    "RUSTSEC-2024-0375", # atty unmaintained (env_logger via litesvm). Host only
    "RUSTSEC-2021-0145", # atty unaligned read on Windows only; host only and not a target here
    "RUSTSEC-2025-0141", # bincode 1.3.3 unmaintained, via solana-instruction. Compiled on chain; unmaintained only, no known vulnerability, no fixed release (solana crates pin 1.x)
    "RUSTSEC-2024-0388", # derivative unmaintained (ark-* via litesvm). Host only, build-time macro
    "RUSTSEC-2025-0161", # libsecp256k1 0.6.0 unmaintained (agave precompiles in litesvm). Host only
    "RUSTSEC-2025-0119", # number_prefix unmaintained (indicatif via solana client crates). Host only
    "RUSTSEC-2024-0436", # paste unmaintained (ark-ff via litesvm). Host only, build-time macro
    "RUSTSEC-2026-0186", # memmap2 0.5.10 unchecked offset (solana-genesis-config via litesvm). Host only; no file is mapped from untrusted input
    "RUSTSEC-2026-0097", # rand 0.7.3 unsound with a custom logger calling rand::rng(), via ed25519-dalek 1.0.1 and solana-keypair. Host only; no custom logger is installed; no 0.7 fix exists
]
