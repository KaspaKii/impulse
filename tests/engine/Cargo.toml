[package]
name = "impulse-engine-tests"
description = "ImpulseVault tests in the real Kaspa script engine (kaspa-txscript, covenants enabled). Test targets only."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false

# Test targets only; every dependency is a dev-dependency, so silverscript-lang never reaches
# a shipped crate. harness.rs is shared through `mod harness;`.
[[test]]
name = "verify"
path = "verify.rs"

[[test]]
name = "escrow_release"
path = "escrow_release.rs"

[[test]]
name = "settle"
path = "settle.rs"

[[test]]
name = "refund"
path = "refund.rs"

[[test]]
name = "locktime"
path = "locktime.rs"

[[test]]
name = "template"
path = "template.rs"

[[test]]
name = "measure"
path = "measure.rs"

[[test]]
name = "instantiate"
path = "instantiate.rs"

# No token of another covenant rides along in a vault spend (L20, the part this closes).
[[test]]
name = "foreign_covenant"
path = "foreign_covenant.rs"

# The other leg's vault in a settle ([S10]): closes the last case of L20, and L8.
[[test]]
name = "foreign_covenant_residual"
path = "foreign_covenant_residual.rs"

[[test]]
name = "builders"
path = "builders.rs"

[[test]]
name = "threshold"
path = "threshold.rs"

[[test]]
name = "v3_vaults"
path = "v3_vaults.rs"

[[test]]
name = "v3_refund_guards"
path = "v3_refund_guards.rs"

[[test]]
name = "v3_journal"
path = "v3_journal.rs"

[[test]]
name = "v3_refund"
path = "v3_refund.rs"

[[test]]
name = "v3p_settle"
path = "v3p_settle.rs"

[[test]]
name = "v3p_locktime"
path = "v3p_locktime.rs"

[[test]]
name = "v3p_escrow_release"
path = "v3p_escrow_release.rs"

[[test]]
name = "v3_template"
path = "v3_template.rs"

[[test]]
name = "v3p_mode"
path = "v3p_mode.rs"

[[test]]
name = "v3_proofs"
path = "v3_proofs.rs"

[[test]]
name = "v3_settle"
path = "v3_settle.rs"

# Template v3, shipped template with the committed proofs: no token of another covenant rides along.
[[test]]
name = "v3_foreign_covenant"
path = "v3_foreign_covenant.rs"

[[test]]
name = "v3_measure"
path = "v3_measure.rs"

[[test]]
name = "v3p_gate"
path = "v3p_gate.rs"

# The suite foreign_covenant.rs against the template v3 probe.
[[test]]
name = "v3p_foreign_covenant"
path = "v3p_foreign_covenant.rs"

# The suite foreign_covenant_residual.rs ([S10]) against the template v3 probe.
[[test]]
name = "v3p_sibling"
path = "v3p_sibling.rs"

[dev-dependencies]
# sha2: the hashlock tests (I18) hash the secret.
sha2.workspace = true
impulse-terms-core = { path = "../../circuits/terms-core" }
impulse-core = { path = "../../crates/impulse-core", features = ["threshold", "zk-hashed", "htlc-secret"] }
kaspa-consensus-core.workspace = true
kaspa-txscript.workspace = true
kaspa-txscript-errors.workspace = true
silverscript-abi.workspace = true
silverscript-lang.workspace = true
rand.workspace = true
secp256k1.workspace = true
serde_json.workspace = true

