# Release build for Linux x86_64 (the owner signs the checksums). The macOS arm64 build is made on
# the key holder's Mac with the same script. This workflow never signs, tags, pushes or
# publishes, and uses no secrets: the artifacts are SHA256SUMS, the two SBOMs and the archive of
# scripts/release.sh. The script builds twice from two exports and fails unless every artifact
# is byte for byte the same.
name: release-linux-x86_64

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release-linux-x86_64:
    runs-on: ubuntu-latest
    # rust:1.94.0-bookworm, pinned by the digest of its multi-platform index (docker pull, then
    # docker inspect --format '{{index .RepoDigests 0}}'). Move the tag and the digest together.
    container: rust:1.94.0-bookworm@sha256:365468470075493dc4583f47387001854321c5a8583ea9604b297e67f01c5a4f
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            .cargo-home/bin
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: release-${{ runner.os }}-
      - name: Prerequisites
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends python3
          test "$(uname -m)" = x86_64
          export PATH="$CARGO_HOME/bin:$PATH"
          command -v cargo-cyclonedx || cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Build twice and compare
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          scripts/release.sh --ref "$GITHUB_SHA" --out "$GITHUB_WORKSPACE/dist" --twice
          cd "$GITHUB_WORKSPACE"/dist/impulse-*-x86_64-unknown-linux-gnu && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 90
