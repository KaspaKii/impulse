# Mirrors scripts/ci-local.sh. The toolchain comes from rust-toolchain.toml (1.94.0).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # rust:1.94.0-bookworm, pinned by the digest of its multi-platform index (docker pull, then
    # docker inspect --format '{{index .RepoDigests 0}}'). Move the tag and the digest together.
    container: rust:1.94.0-bookworm@sha256:365468470075493dc4583f47387001854321c5a8583ea9604b297e67f01c5a4f
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      # Node for wasm-pack test --node and the TypeScript suite, checked against nodejs.org's
      # SHASUMS256.txt for this release.
      NODE_VERSION: "22.22.1"
      NODE_SHA256: "9a6bc82f9b491279147219f6a18add1e18424dce90d41d2a5fcd69d4924ba3aa"
      IMPULSE_BROWSER: /usr/bin/chromium
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            .cargo-home/bin
            target
          key: ci-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ci-${{ runner.os }}-
      - name: System packages
        # clang and llvm (llvm-ar) build libsecp256k1 for wasm32; xz-utils unpacks Node;
        # chromium runs the headless browser tests of the demo.
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 xz-utils clang llvm chromium
      - name: Record the Chromium version
        run: chromium --version
      - name: Cargo tools
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          command -v cargo-audit || cargo install cargo-audit --version 0.22.1 --locked
          command -v cargo-deny || cargo install cargo-deny --version 0.19.9 --locked
          command -v wasm-bindgen || cargo install wasm-bindgen-cli --version 0.2.100 --locked
          command -v wasm-pack || cargo install wasm-pack --version 0.14.0 --locked
      - name: Node
        run: |
          curl -sSfL -o /tmp/node.tar.xz "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz"
          echo "$NODE_SHA256  /tmp/node.tar.xz" | sha256sum -c -
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
      - name: gitleaks 8.30.1
        # Checked against the sha256 of the release archive.
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: scripts/ci-local.sh
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          scripts/ci-local.sh
