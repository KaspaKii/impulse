# The terms guest (spec/V3-ZK.md section 22.4). Built only by risc0-build in Docker (methods/build.rs);
# its image ID is circuits/IMAGE_ID_V4. Its own workspace and Cargo.lock: cargo builds it --locked.
[package]
name = "terms-guest"
version = "0.3.0-alpha"
edition = "2021"
license = "Apache-2.0"

[workspace]

[dependencies]
impulse-terms-core = { path = "../terms-core" }
risc0-zkvm = { version = "=3.0.4", default-features = false, features = ["std"] }

[profile.release]
codegen-units = 1
lto = "fat"
